name: Kiểm tra hệ thống
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/integration/requirements.lock.txt
      - run: npm run setup
      - run: npm --prefix backend run env:check
      - run: npm --prefix backend test
      - run: python -m pip install -r backend/integration/requirements.lock.txt
      - run: npm --prefix backend run test:fastapi
      - run: npm --prefix backend run docs:generate
      - run: git diff --exit-code -- backend/docs/openapi.json backend/docs/postman.collection.json
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e
      - run: docker compose build
      - run: npm run docker:smoke
